# Описания своих медиа. Скопируй в media/media.toml (папка media/ не коммитится).
#
# Раскладка папок:
#   media/photo/   фото (.jpg .png .webp)
#   media/video/   видео (.mp4 .mov .webm .mkv)
#   media/voice/   голосовые (.ogg/.opus — как есть; .mp3 .m4a .wav — сконвертируются в opus)
#   media/round/   кружочки (любое видео: обрежется в квадрат 384×384, до 60 сек)
# Подпапка later/ внутри любой из них = when = "later" по умолчанию.
# Файл без записи здесь тоже работает: бот понимает его по названию (назови голосовое теми словами,
# что в нём говоришь, фото — тем, что на нём), when = "now", язык голосового — по буквам названия.
#
# Поля:
#   file  — путь от папки media/ (или просто имя файла)
#   about — что на фото/видео или что говоришь в голосовом. Модель выбирает по этому
#           тексту, так что пиши конкретно
#   when  — "now"   можно отправить сразу, когда просят или к месту
#           "later" потянуть время: на первую просьбу отмазаться, потом отправить с задержкой
#           "never" не отправлять (файл временно скрыт)
#   delay — для "later": [мин, макс] минут до отправки (по умолчанию MEDIA_LATER_MIN/MAX)
#
# Перед голосовым собеседник видит «записывает аудио» столько, сколько оно длится,
# перед кружочком — «записывает видео». Каждое медиа уходит в чат максимум один раз.

[[media]]
file = "photo/cat.jpg"
about = "мой кот спит на подоконнике"
when = "now"

[[media]]
file = "photo/later/selfie.jpg"
about = "моё селфи в зеркале"
when = "later"
delay = [20, 90]

[[media]]
file = "voice/privet.ogg"
about = "говорю: «привет, ну как ты там? я щас в автобусе, не могу писать»"
when = "now"

[[media]]
file = "round/walk.mp4"
about = "кружочек: иду по парку, машу рукой, говорю «привет»"
when = "later"
